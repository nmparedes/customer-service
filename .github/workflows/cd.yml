name: Customer Service CD

on:
  workflow_run:
    workflows:
      - Customer Service CI
    types:
      - completed

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'homologation'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: homologation
    env:
      SERVICE_NAME: customer-service
      IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/customer-service:${{ github.event.workflow_run.head_sha }}
      IMAGE_CHANNEL: ghcr.io/${{ github.repository_owner }}/customer-service:homologation
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      CUSTOMER_DB_HOST: ${{ vars.CUSTOMER_DB_HOST }}
      CUSTOMER_DB_SSL: ${{ vars.CUSTOMER_DB_SSL }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      CUSTOMER_DB_USERNAME: ${{ secrets.CUSTOMER_DB_USERNAME }}
      CUSTOMER_DB_PASSWORD: ${{ secrets.CUSTOMER_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require deployment configuration
        run: |
          test -n "${K8S_NAMESPACE}" || { echo "K8S_NAMESPACE is required."; exit 1; }
          test -n "${KUBECONFIG_B64}" || { echo "KUBECONFIG_B64 is required."; exit 1; }
          test -n "${CUSTOMER_DB_HOST}" || { echo "CUSTOMER_DB_HOST is required."; exit 1; }
          test -n "${CUSTOMER_DB_SSL}" || { echo "CUSTOMER_DB_SSL is required."; exit 1; }
          test -n "${CUSTOMER_DB_USERNAME}" || { echo "CUSTOMER_DB_USERNAME is required."; exit 1; }
          test -n "${CUSTOMER_DB_PASSWORD}" || { echo "CUSTOMER_DB_PASSWORD is required."; exit 1; }
          test -n "${JWT_SECRET}" || { echo "JWT_SECRET is required."; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        run: docker build -t "${IMAGE_SHA}" -t "${IMAGE_CHANNEL}" .

      - name: Publish container image
        run: |
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_CHANNEL}"

      - name: Configure kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply service manifests
        run: |
          kubectl kustomize k8s \
            | python3 -c 'import os,sys; sys.stdout.write(os.path.expandvars(sys.stdin.read()))' \
            | sed "s|ghcr.io/replace-me/customer-service:latest|${IMAGE_SHA}|g" \
            | kubectl apply -n "${K8S_NAMESPACE}" -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/customer-service -n "${K8S_NAMESPACE}" --timeout=5m
